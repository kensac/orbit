# Publishes only what passed. A main commit whose CI run succeeded (every
# job in ci.yml, check included) is built and pushed by digest, untagged;
# each architecture's image is then started against a throwaway Postgres
# (deploy/smoke.sh: migrate, validate the examples, healthy and ready) and
# the build sandbox's image is run as sandboxd runs it
# (deploy/build-smoke.sh). Only then do sha-<commit> and latest point at
# those digests (.github/scripts/publish-tags.sh). A red CI run or a failed
# smoke tags nothing, so no pin or Renovate update can pick the image up.
# To publish a commit again, re-run its CI run or this run.
name: Build and Push to GHCR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      orbit: ${{ steps.orbit.outputs.digest }}
      build: ${{ steps.build.outputs.digest }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest with no tag: nothing can pin it until the smoke
      # below passes. The revision label is the tested commit (in a
      # workflow_run, github.sha is main's tip, which may be newer).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: orbit
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          build-args: |
            GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The build sandbox's image (deploy/build.Dockerfile), run by sandboxd
      # on hetzner. sandboxd pins it by digest, so a push here reaches a
      # sandbox only when that pin moves.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: deploy/build.Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }}-build,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Natively on each architecture the fleet runs: hetzner amd64, oci arm64.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: deploy/smoke.sh "ghcr.io/${{ github.repository }}@${{ needs.build.outputs.orbit }}" "${{ github.event.workflow_run.head_sha }}"
      - run: deploy/build-smoke.sh "ghcr.io/${{ github.repository }}-build@${{ needs.build.outputs.build }}"

  tag:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/publish-tags.sh sha "ghcr.io/${{ github.repository }}" "${{ needs.build.outputs.orbit }}" "${{ github.event.workflow_run.head_sha }}"
      - run: .github/scripts/publish-tags.sh sha "ghcr.io/${{ github.repository }}-build" "${{ needs.build.outputs.build }}" "${{ github.event.workflow_run.head_sha }}"

  latest:
    needs: [build, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One latest move at a time, so two commits never interleave their
    # checks; a newer pending one replaces an older pending one.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: git fetch -q origin main
      - run: .github/scripts/publish-tags.sh latest "ghcr.io/${{ github.repository }}" "${{ needs.build.outputs.orbit }}" "${{ github.event.workflow_run.head_sha }}"
      - run: .github/scripts/publish-tags.sh latest "ghcr.io/${{ github.repository }}-build" "${{ needs.build.outputs.build }}" "${{ github.event.workflow_run.head_sha }}"
