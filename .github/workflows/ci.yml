name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Database tests fail, not skip, under CI (internal/testdb).
      ORBIT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt-check vet prose validate
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make lint
      - run: make test
      # The previous release keeps working on this change's schema, as it
      # must while a rollout runs both (deploy/compat.sh): a pull request's
      # base, or the commit a push to main moved from.
      - name: Previous release on the new schema
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then echo "no previous commit to check against"; exit 0; fi
          git fetch -q --no-tags --depth=1 origin "$BASE"
          make compat BASE="$BASE"
      - run: make vuln
      # The image builds. Publishing is build-push-ghcr.yml's job, for a
      # main commit whose run of this workflow succeeded.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: orbit:ci
          platforms: linux/amd64
          cache-from: type=gha
      # It boots: migrates an empty database, loads the examples, becomes
      # healthy and ready (deploy/smoke.sh, as before a publish).
      - if: github.event_name == 'pull_request'
        run: deploy/smoke.sh orbit:ci
      # The build sandbox's image builds too (internal/sandboxd).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: deploy/build.Dockerfile
          push: false
          load: true
          tags: orbit-build:ci
          platforms: linux/amd64
          cache-from: type=gha
      # It runs the way sandboxd runs it (deploy/build-smoke.sh).
      - if: github.event_name == 'pull_request'
        run: deploy/build-smoke.sh orbit-build:ci
