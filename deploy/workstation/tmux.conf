# Terminals are tmux sessions a browser attaches to, from several devices.
# OSC 52 copies reach the browser's clipboard; the window follows the
# device used last; the mouse scrolls and selects.
set -g set-clipboard on
set -g window-size latest
set -g mouse on
set -g default-terminal "tmux-256color"
set -g history-limit 10000
# A Claude Code (direct) terminal's credential reaches its new session from
# the attaching client's environment (orbit sets it per attach; it is never
# written into the box's files).
set -ga update-environment CLAUDE_CODE_OAUTH_TOKEN
