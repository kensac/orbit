# The deployment file: where notifications go, which backends exist, and the
# endpoints an action may reach. Secrets are named by environment variable.
timezone: America/New_York
public_url: http://orbit.example.ts.net:8080

defaults:
  runner: claude
  timeout: 15m
  channels: [phone]

runners:
  claude:
    kind: claude-code
    model: claude-opus-5-5
    max_turns: 30
  codex:
    kind: codex
    model: gpt-6
  api:
    kind: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY

channels:
  phone:
    kind: ntfy
    url: https://ntfy.example.com
    topic_env: ORBIT_NTFY_TOPIC
  email:
    kind: smtp
    host: mail.example.com
    port: 587
    username_env: ORBIT_SMTP_USER
    password_env: ORBIT_SMTP_PASS
    from: orbit <orbit@example.com>
    to: [me@example.com]
  log:
    kind: log

# orbit's mailbox (docs/agents/configuration.md, Mail): replies to its mails
# continue their conversation; a new mail starts one with `agent`.
mail:
  address: orbit@example.com
  imap:
    host: mail.example.com
    username_env: ORBIT_SMTP_USER
    password_env: ORBIT_SMTP_PASS
  allow: [me@example.com]

# Secrets a source may send, each only to URLs under its prefix. These are
# the only ${VAR}s an agent defined through the API or by agent:define may
# reference (docs/agents/configuration.md, Secrets).
credentials:
  SURE_API_KEY:
    url_prefix: https://sure.example.com/api/

endpoints:
  home-assistant:
    url: http://homeassistant.example.ts.net:8123/api/webhook/orbit
    method: POST

# The GitHub App orbit acts as (docs/tickets.md). Tickets may target only
# these repositories; the key is read by orbit and never given to a model.
github:
  app_id: 123456
  private_key_env: ORBIT_GITHUB_APP_PRIVATE_KEY
  repositories: [kensac/orbit]
  # What agents may read (an agent's repos:), separate from what tickets and
  # merges may target above.
  read_repositories: [kensac/orbit]

# How approved tickets are built (docs/tickets.md, The build run): in a
# sandbox from orbit sandboxd, run by the agent named here, under each
# repository's tool policy. Without this section no ticket is built.
build:
  sandboxd: sandbox.example.ts.net:8091
  token_env: ORBIT_SANDBOX_TOKEN
  agent: builder
  # The App's bot user: id from `gh api /users/orbit-kensac%5Bbot%5D --jq .id`.
  author: "orbit-kensac[bot] <351241810+orbit-kensac[bot]@users.noreply.github.com>"
  repositories:
    kensac/orbit:
      commands: [go build, go test, go vet, gofmt, make check, make check-sandbox, make fmt, make test,
                 git status, git diff, git log, git show, ls, rg]
      protected: ["deploy/**"]
      max_diff_lines: 2000
